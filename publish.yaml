name: Publish Python Package

on:
  release:
    types: [published] # Triggers when you create a new GitHub Release

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org # Replace with your package name
    permissions:
      id-token: write # Required for PyPI Trusted Publishing OIDC authentication

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Build Dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install build

    - name: Build Package Artifacts
      run: python -m build

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
