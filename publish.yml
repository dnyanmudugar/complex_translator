name: Publish Python Package

on:
  release:
    types: [published] # Triggers automatically when you hit 'Publish' on a GitHub Release

permissions:
  contents: read

jobs:
  test_and_deploy:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org # Replace with your package URL if named differently
    permissions:
      id-token: write # CRITICAL: Gives GitHub permission to securely trade OIDC tokens with PyPI [1]

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Testing & Build Tools
      run: |
        python -m pip install --upgrade pip
        python -m pip install build pytest
        python -m pip install -e .

    # The pipeline halts automatically if your test suite reports an issue
    - name: Run Pytest Suite
      run: python -m pytest

    - name: Build Package Distribution Archives
      run: python -m build

    - name: Securely Deploy to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
